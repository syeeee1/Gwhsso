<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My iPhone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;height:100vh;overflow:hidden;display:grid;place-items:center;background:#d7d7dc;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif}
button{cursor:pointer;font-family:inherit}

/* ===== 폰 본체 ===== */
.phone{width:320px;height:660px;padding:7px;border-radius:50px;background:linear-gradient(135deg,#8d8d93,#2b2b2e 30%,#4a4a4f 55%,#18181a 80%,#7c7c82);box-shadow:0 25px 60px #35334b66,inset 0 0 0 1.5px #ffffff30;position:relative;flex:none}
.phone:before{content:"";position:absolute;left:-3px;top:130px;width:3px;height:55px;background:#65666f;border-radius:4px 0 0 4px}
.phone:after{content:"";position:absolute;right:-3px;top:155px;width:3px;height:85px;background:#65666f;border-radius:0 4px 4px 0}
.screen{width:100%;height:100%;border-radius:43px;overflow:hidden;position:relative;color:#fff;background:linear-gradient(160deg,var(--a,#b4b4ba),var(--b,#8a8a90) 50%,var(--c,#5c5c62))}
.status{position:absolute;top:13px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 32px;z-index:5;font-size:14px;font-weight:600;pointer-events:none}
.status .r{display:flex;gap:5px;align-items:center}
.screen.light .status{color:#111}
body.dark .screen.light .status{color:#fff}
.island{position:absolute;z-index:10;top:9px;left:50%;transform:translateX(-50%);width:100px;height:28px;border-radius:20px;background:#000;transition:width .25s}
.island.active{width:118px}
.island:after{content:"";position:absolute;right:14px;top:10px;width:8px;height:8px;background:radial-gradient(#2a3a55,#0a0f1a);border-radius:50%}
.page{display:none;position:absolute;inset:0}
.page.active{display:block}
.homebar{position:absolute;z-index:30;bottom:7px;left:50%;transform:translateX(-50%);width:108px;height:4.5px;border-radius:5px;background:#fff;cursor:pointer}
.screen.light .homebar{background:#111}
body.dark .screen.light .homebar{background:#fff}

/* ===== 잠금화면 ===== */
.lock{text-align:center;padding-top:104px}
.date{font-size:16px;font-weight:600;opacity:.9;text-shadow:0 1px 5px #0002}
.time{font-size:80px;font-weight:600;letter-spacing:-2px;line-height:1.02;margin-top:2px;font-variant-numeric:tabular-nums;text-shadow:0 1px 8px #0002;opacity:.92}
.unlock{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:transparent;border:0;color:#ffffffbb;font-size:11px;padding:10px 20px;white-space:nowrap}
.lbtn{position:absolute;bottom:50px;width:44px;height:44px;border-radius:50%;background:#00000045;backdrop-filter:blur(14px);display:grid;place-items:center;border:0}
.lbtn.l{left:36px}.lbtn.r{right:36px}
.lbtn svg{width:20px;height:20px;fill:#fff}

/* ===== 홈화면 ===== */
.home-content{padding:92px 18px 100px}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.widget{height:104px;padding:12px;border-radius:22px;overflow:hidden;box-shadow:0 3px 10px #00000014;cursor:pointer}
.widget-label{font-size:11px;font-weight:600}
.temperature{font-size:32px;font-weight:300;margin-top:4px;line-height:1.1}
.widget-info{font-size:10.5px;margin-top:6px;opacity:.95}
.weather-widget{background:linear-gradient(160deg,#4a9bf0,#2c6fd6);color:#fff}
.calendar-widget{background:#fff;color:#222}
.calendar-top{font-size:11px;color:#ff3b30;font-weight:700}
.calendar-number{font-size:36px;font-weight:300;line-height:1.1;margin-top:2px}
.calendar-event{font-size:10px;color:#777;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px}
.app{text-align:center;font-size:10.5px;color:#fff;cursor:pointer;min-width:0;text-shadow:0 1px 3px #0004}
.icon{width:54px;height:54px;margin:0 auto 5px;border-radius:22.5%;overflow:hidden;box-shadow:0 2px 7px #0003;transition:transform .15s,filter .15s}
.icon svg{display:block;width:100%;height:100%}
.app:active .icon{transform:scale(.88);filter:brightness(.8)}
.dock{position:absolute;left:12px;right:12px;bottom:22px;height:76px;border-radius:30px;background:#ffffff3a;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-evenly}
.dock .icon{margin:0}

/* ===== 앱 공통 (iOS 스타일) ===== */
:root{--bg:#f2f2f7;--card:#fff;--wh:#fff;--tx:#000;--sub:#8e8e93;--sep:#e0e0e5;--fill:#e9e9ee;--acc:#0a84ff}
body.dark{--bg:#000;--card:#1c1c1e;--wh:#000;--tx:#fff;--sep:#38383a;--fill:#2c2c2e}
.dk{--bg:#000;--card:#1c1c1e;--wh:#000;--tx:#fff;--sep:#38383a;--fill:#2c2c2e}
.ap{background:var(--bg);color:var(--tx);flex-direction:column;padding-top:52px;font-size:16px}
.chatp{background:var(--wh)}
.page.active.ap{display:flex}
.page.ap.anim{animation:op .25s ease}
@keyframes op{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.screen[data-bar=sys] .status{color:var(--tx)}
.screen[data-bar=sys] .homebar{background:var(--tx)}
.homebar:before{content:"";position:absolute;inset:-16px -24px}
.sc{flex:1;overflow-y:auto;padding:0 16px 16px;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.lt{font-size:32px;font-weight:700;margin:4px 0 10px;letter-spacing:.3px}
.tr{display:flex;justify-content:space-between;align-items:center;color:var(--acc);min-height:30px}
.nv2{display:flex;justify-content:space-between;align-items:center;padding:0 14px 6px;min-height:34px;color:var(--acc)}
.bk{background:none;border:0;color:var(--acc);font-size:16px;display:flex;align-items:center;gap:3px;padding:0}
.bk b{font-size:30px;font-weight:300;line-height:1;margin-top:-4px}
.sb{background:var(--fill);border-radius:10px;padding:8px 10px;color:var(--sub);display:flex;gap:6px;align-items:center;margin-bottom:14px}
.sb svg{width:17px;height:17px;fill:var(--sub)}
.cap{color:var(--sub);font-size:13px;margin:0 0 6px 14px;text-transform:uppercase}
.grp{background:var(--card);border-radius:12px;margin-bottom:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding-left:14px;cursor:pointer}
.li>.in{flex:1;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 0;border-bottom:.5px solid var(--sep);min-width:0}
.li:last-child>.in{border:0}
.tx{flex:1;min-width:0}
.tx small{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--sub);font-size:14px}
.val{margin-left:auto;color:var(--sub)}
.chev{color:#c4c4c9;font-size:22px;line-height:1}
.si{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;flex:none}
.si svg{width:18px;height:18px;fill:#fff}
.mi svg{width:22px;height:22px;fill:var(--acc);flex:none}
.tabbar{display:flex;flex:none;border-top:.5px solid var(--sep);background:var(--card);padding:6px 0 22px}
.tb{flex:1;background:none;border:0;color:var(--sub);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}
.tb svg{width:25px;height:25px;fill:currentColor}
.tb.on{color:var(--acc)}
.sw{width:51px;height:31px;border-radius:16px;background:#78788052;border:0;position:relative;transition:.2s;flex:none;padding:0}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:.2s}
.sw.on{background:#34c759}.sw.on:after{left:22px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(#a8adb8,#868b97);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:600;flex:none}
.av.sm{width:34px;height:34px;font-size:15px}
.info{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--acc);color:var(--acc);font-size:12px;display:grid;place-items:center;font-weight:700;font-family:Georgia,serif;flex:none}
/* 키패드 */
.dn{text-align:center;font-size:32px;min-height:46px;margin:14px 0 8px;overflow:hidden}
.kp{display:grid;grid-template-columns:repeat(3,64px);gap:11px 17px;justify-content:center}
.k{width:64px;height:64px;border-radius:50%;border:0;background:var(--fill);color:var(--tx);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.k:active{background:#8e8e9380}
.k small{font-size:8px;letter-spacing:2px;font-weight:700;height:9px;margin-top:2px}
.cr{display:grid;grid-template-columns:repeat(3,64px);gap:17px;justify-content:center;margin-top:14px;align-items:center}
.cl{grid-column:2;width:64px;height:64px;border-radius:50%;background:#34c759;border:0;display:grid;place-items:center;padding:0}
.cl svg{width:30px;height:30px;fill:#fff}
.del{grid-column:3;background:none;border:0;color:var(--sub);font-size:26px}
.callp{background:linear-gradient(160deg,#7d8fac,#343c57);color:#fff;align-items:center;text-align:center;padding-top:120px}
.callp .av{width:90px;height:90px;font-size:40px;margin-bottom:16px;background:#ffffff33}
.endc{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:#ff453a;border:0;display:grid;place-items:center;padding:0}
.endc svg{width:30px;height:30px;fill:#fff;transform:rotate(135deg)}
/* 메시지 */
.chh{display:flex;align-items:center;justify-content:space-between;padding:0 12px 6px;border-bottom:.5px solid var(--sep);background:var(--card)}
.chc{text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:10px 16px}
.ts{align-self:center;color:var(--sub);font-size:11px;margin:6px 0}
.bb{max-width:75%;padding:7px 12px;border-radius:18px;font-size:15px;line-height:1.28;position:relative;overflow-wrap:anywhere}
.bb.r{background:var(--fill);align-self:flex-start}
.bb.s{background:#0a84ff;color:#fff;align-self:flex-end}
.bb.t{margin-bottom:6px}
.bb.s.t:before{content:"";position:absolute;right:-6px;bottom:0;width:20px;height:18px;background:#0a84ff;border-bottom-left-radius:16px 14px}
.bb.s.t:after{content:"";position:absolute;right:-26px;bottom:0;width:26px;height:18px;background:var(--wh);border-bottom-left-radius:10px}
.bb.r.t:before{content:"";position:absolute;left:-6px;bottom:0;width:20px;height:18px;background:var(--fill);border-bottom-right-radius:16px 14px}
.bb.r.t:after{content:"";position:absolute;left:-26px;bottom:0;width:26px;height:18px;background:var(--wh);border-bottom-right-radius:10px}
.dl{align-self:flex-end;color:var(--sub);font-size:11px;margin:-2px 2px 4px}
.cbar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 24px;background:var(--wh)}
.plus{width:32px;height:32px;border-radius:50%;background:var(--fill);border:0;color:var(--sub);font-size:22px;line-height:1;flex:none;padding:0}
.pill{flex:1;display:flex;align-items:center;gap:6px;border:1px solid var(--sep);border-radius:18px;min-height:34px;padding:0 4px 0 12px;margin:0}
.pill input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;color:var(--tx);padding:7px 0;font-family:inherit}
.sbtn{display:none;width:26px;height:26px;border-radius:50%;background:#0a84ff;border:0;place-items:center;flex:none;padding:0}
.sbtn svg{width:16px;height:16px}
.mic{width:22px;height:22px;fill:var(--sub);margin-right:4px;flex:none}
.pill.has .sbtn{display:grid}.pill.has .mic{display:none}
/* 사진 */
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;margin:0 -16px}
.pt{aspect-ratio:1;border:0;padding:0}
.cnt{text-align:center;color:var(--sub);font-size:13px;margin:14px 0 4px}
.tl{display:flex;justify-content:space-around;padding:10px 0 28px;color:#0a84ff}
.tl svg{width:26px;height:26px;fill:#0a84ff}.tl button{background:none;border:0;padding:0}
/* 카메라 */
.vf{flex:1;border-radius:14px;background:linear-gradient(160deg,#8aa0c8,#d9b8c8 55%,#f0d2b0);position:relative;overflow:hidden}
.zm{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#0005;padding:4px;border-radius:20px;font-size:11px;color:#fff}
.zm span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.zm .a{background:#0009;color:#ffd60a}
.md{display:flex;justify-content:center;gap:18px;font-size:12px;font-weight:600;color:#fff;margin:10px 0 6px}
.md .a{color:#ffd60a}
.cc{display:flex;align-items:center;justify-content:space-around;padding:6px 20px 28px}
.sh{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:none;position:relative;padding:0}
.sh:after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}
.sh:active:after{inset:6px}
.th{width:44px;height:44px;border-radius:9px;border:1.5px solid #fff4}
.fl{width:44px;height:44px;border-radius:50%;background:#2c2c2e;display:grid;place-items:center}
.fl svg{width:24px;height:24px;fill:#fff}
.flash{position:absolute;inset:0;background:#fff;z-index:20;opacity:0;pointer-events:none}
.flash.go{animation:fl .3s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
/* 메모 */
.ntx{flex:1;border:0;background:none;outline:none;resize:none;font-size:17px;line-height:1.4;color:var(--tx);font-family:inherit;padding:8px 16px 30px}
.nf{display:flex;justify-content:center;align-items:center;position:relative;padding:10px 16px 24px;color:var(--sub);font-size:11px;background:var(--bg);flex:none}
.nf button{position:absolute;right:16px;top:6px;background:none;border:0;padding:0}
.nf svg{width:26px;height:26px;fill:var(--acc)}
/* 시계 */
.wc{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid var(--sep)}
.wc small{color:var(--sub);font-size:13px;display:block}
.wc .c{font-size:24px}.wc .t{font-size:36px;font-weight:200}
.al{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--sep)}
.al .t{font-size:46px;font-weight:200}.al .t i{font-size:20px;font-style:normal}
.al small{display:block;color:var(--sub);font-size:13px}
.swt{text-align:center;font-size:60px;font-weight:200;margin:36px 0 26px;font-variant-numeric:tabular-nums}
.rb{display:flex;justify-content:space-between;padding:0 14px 14px;border-bottom:.5px solid var(--sep);margin-bottom:8px}
.rd{width:70px;height:70px;border-radius:50%;border:0;font-size:16px;color:#fff;background:#2c2c2e}
.rd.g{background:#0e3a1a;color:#30d158}.rd.r{background:#3a1511;color:#ff453a}
.chp{display:flex;gap:8px;justify-content:center;margin:12px 0}
.chp button{background:#2c2c2e;color:#fff;border:0;border-radius:18px;padding:8px 14px;font-size:14px}.chp .on{background:#ff9f0a}
.lp{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:.5px solid var(--sep);font-size:15px}
/* 날씨 */
.wt{background:linear-gradient(180deg,#3d7fd8,#6fb4ec 55%,#9cc9ee);color:#fff;text-shadow:0 1px 3px #0002}
.wh{text-align:center;margin:6px 0 16px}
.wh .n{font-size:30px}.wh .d{font-size:84px;font-weight:200;line-height:1;margin:2px 0;padding-left:16px}.wh .s{font-size:17px}.wh .h{font-size:16px;margin-top:2px}
.fc{background:#ffffff2e;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.fc h5{margin:0 0 6px;font-size:11px;font-weight:600;opacity:.8;padding-bottom:6px;border-bottom:.5px solid #ffffff55}
.hr{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none}
.hr div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;flex:none}
.hr svg,.dy svg{width:26px;height:26px}
.dy{display:grid;grid-template-columns:40px 28px 28px 1fr 28px;gap:8px;align-items:center;font-size:15px;padding:7px 0;border-top:.5px solid #ffffff40}
.dy .mn{opacity:.65;text-align:right}
.br{height:4px;border-radius:2px;background:#0003;position:relative}
.br i{position:absolute;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#8de2a0,#ffd60a)}
/* 설정 */
.wp{aspect-ratio:9/16;border-radius:10px;border:2px solid transparent}
.wp.on{border-color:#0a84ff}
/* 음악 */
.aw{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.art{aspect-ratio:1;border-radius:8px;box-shadow:0 2px 8px #0002}
.aw small{display:block;color:var(--sub);font-size:12px}
.mp{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-top:.5px solid var(--sep);flex:none;cursor:pointer}
.mp .art{width:40px;border-radius:6px;flex:none}
.mp button{background:none;border:0;padding:0}
.mp svg{width:26px;height:26px;fill:var(--tx)}
.np{background:linear-gradient(180deg,#5a3a5e,#2a2030);color:#fff;padding:60px 28px 40px}
.np .art{width:100%;max-width:250px;margin:10px auto 22px;display:block;border-radius:12px;box-shadow:0 12px 30px #0006}
.pr{height:4px;background:#ffffff40;border-radius:2px;margin:18px 0 6px}.pr i{display:block;height:100%;background:#fff;border-radius:2px;width:0}
.ct{display:flex;justify-content:center;align-items:center;gap:34px;margin-top:20px}
.ct svg{width:34px;height:34px;fill:#fff}.ct .pl svg{width:52px;height:52px}.ct button{background:none;border:0;padding:0}
/* 토스트 */
.toast{position:absolute;z-index:30;top:52px;left:50%;transform:translateX(-50%);background:#222d;color:#fff;padding:10px 14px;border-radius:20px;font-size:12px;white-space:nowrap;display:none}
.toast.show{display:block}
body.dark{background:#17171c}
body.dark .phone{box-shadow:0 20px 60px #0009}
.tr svg,.nv2 svg{width:24px;height:24px;fill:var(--acc)}
.av svg{width:55%;height:55%;fill:#fff}
</style>
</head>
<body>

<!-- ===== 앱 아이콘 (애플 느낌 SVG) ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
  <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6bf27f"/><stop offset="1" stop-color="#0bb83a"/></linearGradient>
  <linearGradient id="gGray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d9de"/><stop offset="1" stop-color="#9a9aa0"/></linearGradient>
  <linearGradient id="gWeather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7be8"/><stop offset="1" stop-color="#63b8f8"/></linearGradient>
  <linearGradient id="gMusic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b81"/><stop offset="1" stop-color="#f4213f"/></linearGradient>

  <symbol id="g-phone" viewBox="0 0 60 60"><rect width="60" height="60" fill="url(#gGreen)"/><g transform="translate(15 15) scale(1.25)"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></g></symbol>

  <symbol id="g-msg" viewBox="0 0 60 60"><rect width="60" height="60" fill="url(#gGreen)"/><path fill="#fff" d="M30 14C17.8 14 9 21.4 9 30.5c0 5.2 2.9 9.7 7.4 12.6-.3 2.800-1.600 5.100-3.400 7 3.900-.2 7.100-1.700 9.500-3.700 2.200.6 4.600.9 7 .9 12.200 0 21-7.400 21-16.800C50.500 21.400 42.200 14 30 14z"/></symbol>

  <symbol id="g-photos" viewBox="0 0 60 60"><rect width="60" height="60" fill="#fff"/>
    <g style="mix-blend-mode:multiply">

function setDark(v){dark=v;document.body.classList.toggle('dark',v)}
function setBr(v){br=v;$('screen').style.filter='brightness('+v/100+')'}
function setWp(n){wpI=n;const s=$('screen');['a','b','c'].forEach((k,i)=>s.style.setProperty('--'+k,wps[n][i]));swall();notify('배경화면을 바꿨어!')}

/* ===== 음악 ===== */
const songs=[['普通朋友','도철','linear-gradient(135deg,#2b2b3a,#6a5acd 55%,#d8a7ff)']];
let si=0,mPlay=false,mt=0;const mD=280;
const tm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function musR(){const e=mk('music','sys','','#fa233b');const s=songs[si];
 e.innerHTML='<div class="sc"><div class="tr"><span></span><span>편집</span></div><div class="lt">보관함</div><div class="grp">'+[['플레이리스트',I.list],['아티스트',I.person],['앨범',I.album],['노래',I.note]].map(r=>li('<span>'+r[0]+'</span><span class="chev" style="margin-left:auto">›</span>','<span class="mi">'+P(r[1])+'</span>','tabNote()')).join('')+'</div><div style="font-size:20px;font-weight:700;margin:0 0 10px">최근 추가한 항목</div><div class="aw">'+songs.map((x,i)=>'<div onclick="playSong('+i+')"><div class="art" style="background:'+x[2]+'"></div><div style="margin-top:6px;font-size:14px">'+x[0]+'</div><small>'+x[1]+'</small></div>').join('')+'</div></div><div class="mp" onclick="npR()"><div class="art" style="background:'+s[2]+'"></div><div class="tx"><div style="font-size:14px">'+s[0]+'</div><small>'+s[1]+'</small></div><button onclick="event.stopPropagation();tgPlay()">'+P(mPlay?I.pause:I.play)+'</button><button onclick="event.stopPropagation();nxSong(1)">'+P(I.next)+'</button></div>'+tabbar([['a','보관함',P(I.note)],['b','라디오',SK('<circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6 6 0 0 0 0 9M16.5 7.5a6 6 0 0 1 0 9M4.5 4.5a10 10 0 0 0 0 15M19.5 4.5a10 10 0 0 1 0 15"/>')],['c','검색',P(I.search)]],'a','tabNote')}
function npR(){const s=songs[si],e=mk('nowp','white','np');
 e.innerHTML='<button class="bk" style="color:#fff;font-size:26px;align-self:flex-start" onclick="openApp(\'music\')">⌄</button><div class="art" style="background:'+s[2]+'"></div><div style="font-size:21px;font-weight:600">'+s[0]+'</div><div style="font-size:18px;opacity:.7">'+s[1]+'</div><div class="pr"><i id="pri" style="width:'+(mt/mD*100)+'%"></i></div><div style="display:flex;justify-content:space-between;font-size:11px;opacity:.7"><span id="pt1">'+tm(mt)+'</span><span>-'+tm(mD-mt)+'</span></div><div class="ct"><button onclick="nxSong(-1)">'+P(I.prev)+'</button><button class="pl" onclick="tgPlay()">'+P(mPlay?I.pause:I.play)+'</button><button onclick="nxSong(1)">'+P(I.next)+'</button></div>';go('nowp')}
function refMusic(){musR();if(cur=='nowp')npR()}
function tgPlay(){mPlay=!mPlay;refMusic()}
function nxSong(d){si=(si+d+songs.length)%songs.length;mt=0;refMusic()}
function playSong(i){si=i;mt=0;mPlay=true;refMusic()}

const render={phone:()=>phoneR(ptab),messages:msgList,photos:photoR,camera:camR,notes:noteList,clock:()=>clockR(ctab),weather:wthR,settings:setR,music:musR};

/* ===== 시간/틱 ===== */
function updateTime(){const now=new Date();
 const t=now.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false});
 $('statusTime').textContent=t;$('time').textContent=t;
 $('date').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
 $('calDow').textContent=now.toLocaleDateString('ko-KR',{weekday:'long'});$('calNum').textContent=now.getDate();
 $('calendarDate').textContent=now.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})+' 일정 없음';
 const h=now.getHours()%12,m=now.getMinutes(),s=now.getSeconds();
 $('hHand').setAttribute('transform','rotate('+(h*30+m*.5)+' 30 30)');
 $('mHand').setAttribute('transform','rotate('+(m*6)+' 30 30)');
 $('sHand').setAttribute('transform','rotate('+(s*6)+' 30 30)')}
function tick(){tk++;
 if(cur=='clock'){if(ctab=='world'&&tk%10==0&&$('wl'))$('wl').innerHTML=wlRows();
  if(ctab=='stop'&&$('swt'))$('swt').textContent=fm(swNow());
  if(ctab=='timer'&&tR&&$('td')){const l=Math.max(0,Math.round((tEnd-Date.now())/1e3));$('td').textContent=tf(l);if(!l){tR=false;notify('타이머 종료!');clockR('timer')}}}
 if(mPlay){mt+=.1;if(mt>=mD)nxSong(1);if($('pri')){$('pri').style.width=(mt/mD*100)+'%';$('pt1').textContent=tm(mt)}}}
updateTime();setInterval(updateTime,1000);setInterval(tick,100);

/* ===== 제스처 ===== */
let lockY=null;const lockScreen=$('lock');
lockScreen.addEventListener('pointerdown',e=>{lockY=e.clientY});
lockScreen.addEventListener('pointerup',e=>{if(lockY!==null&&lockY-e.clientY>35)goHome();lockY=null});
let gy=null;const scr=$('screen');
scr.addEventListener('pointerdown',e=>{const r=scr.getBoundingClientRect();gy=(cur!='lock'&&cur!='home'&&(e.clientY-r.top)/r.height>.93)?e.clientY:null});
scr.addEventListener('pointerup',e=>{if(gy!==null&&gy-e.clientY>25)goHome();gy=null});

function fit(){const s=Math.min(1,(innerHeight-20)/680,(innerWidth-10)/330);$('phoneBox').style.transform='scale('+s+')'}
fit();addEventListener('resize',fit);
</script>
</body>
</html>
